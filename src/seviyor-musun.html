<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Beni seviyor musun?</title>
  <link rel="stylesheet" href="../style.css">
  <style>
    main { text-align: center; padding-top: 20vh; }
    .buttons { display: flex; justify-content: center; align-items: center; gap: 1rem; flex-wrap: wrap; }
    button { font: inherit; cursor: pointer; border-radius: 0.5rem; touch-action: manipulation; }
    #yes { padding: 0.4em 1.2em; border: 0; background: var(--link); color: var(--bg); }
    #no { padding: 0.4em 1.2em; border: 2px solid var(--muted); background: var(--bg); color: var(--fg); z-index: 2; }
    /* Once big enough, "Evet" takes over the whole screen */
    #yes.full { position: fixed; inset: 0; width: 100%; border-radius: 0; font-size: 4rem; z-index: 1; }
  </style>
</head>
<body>
  <main>
    <h1 id="question">Beni seviyor musun?</h1>
    <div class="buttons">
      <button id="yes">Evet</button>
      <span id="slot"><button id="no">Hayır</button></span>
    </div>
  </main>
  <script>
    const yes = document.getElementById("yes");
    const no = document.getElementById("no");
    const slot = document.getElementById("slot");
    let presses = 0;

    function dodge() {
      if (presses === 0) {
        // Keep the button's original spot reserved so the layout doesn't jump
        slot.style.width = no.offsetWidth + "px";
        slot.style.height = no.offsetHeight + "px";
        no.style.position = "fixed";
      }
      presses++;
      no.style.fontSize = Math.max(0.5, 1 - presses * 0.08) + "rem";
      yes.style.fontSize = 1 + presses * 0.5 + "rem";
      if (presses >= 8) yes.classList.add("full");

      // Jump somewhere random on screen, away from "Evet" when possible
      const w = document.documentElement.clientWidth - no.offsetWidth;
      const h = document.documentElement.clientHeight - no.offsetHeight;
      const y = yes.getBoundingClientRect();
      for (let i = 0; i < 20; i++) {
        const left = Math.random() * w;
        const top = Math.random() * h;
        const overlaps = left + no.offsetWidth > y.left && left < y.right && top + no.offsetHeight > y.top && top < y.bottom;
        no.style.left = left + "px";
        no.style.top = top + "px";
        if (!overlaps) break;
      }
    }

    // pointerdown fires the moment a finger touches (no hover on phones), before any click
    no.addEventListener("pointerdown", (e) => { e.preventDefault(); dodge(); });
    // Keyboard "click" (Enter/Space) has detail 0; mouse/touch clicks were already handled above
    no.addEventListener("click", (e) => { e.preventDefault(); if (e.detail === 0) dodge(); });

    yes.addEventListener("click", () => {
      document.querySelector("main").innerHTML = "<h1>Ben de seni çok seviyorum.</h1>";
      yes.remove();
      no.remove();
    });
  </script>
</body>
</html>
